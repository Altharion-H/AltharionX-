name: Publish Android Debug APK Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure APK Artifacts Ready
        run: |
          if [ -f "./ARISE-debug.apk" ] && [ ! -f "./app-debug.apk" ]; then
            cp ./ARISE-debug.apk ./app-debug.apk
          elif [ -f "./app-debug.apk" ] && [ ! -f "./ARISE-debug.apk" ]; then
            cp ./app-debug.apk ./ARISE-debug.apk
          fi
          ls -lh ./app-debug.apk ./ARISE-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARISE-debug-apk
          path: |
            ./app-debug.apk
            ./ARISE-debug.apk
          if-no-files-found: error

      - name: Publish Permanent GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug APK Build (ARISE)"
          body: |
            ### Automated Android Debug APK Release
            - **Repository:** `Altharion-H/AltharionX`
            - **Application Name:** ARISE
            - **Application ID:** `com.aistudio.arisephysique.xkrptq`
            - **Direct APK Download Links:**
              - [Download ARISE-debug.apk](https://github.com/Altharion-H/AltharionX/releases/latest/download/ARISE-debug.apk)
              - [Download app-debug.apk](https://github.com/Altharion-H/AltharionX/releases/latest/download/app-debug.apk)
          prerelease: false
          files: |
            ./app-debug.apk
            ./ARISE-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
